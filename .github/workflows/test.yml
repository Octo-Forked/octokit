name: Test
on:
  push:
    branches:
      - dependabot/npm_and_yarn/**
      - main
      - next
      - beta
      - v[0-9]+
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  test-building:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          cache: npm
          node-version: lts/*
      - run: npm ci
      - run: npm run --workspaces build

  test_matrix:
    needs: test-building
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node_version:
          - 20
          - 22
          - 24
    name: Node ${{ matrix.node_version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node_version }}
          cache: npm
      - run: npm ci
      - run: npm run --workspaces test

  test-deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x # Run with latest stable Deno.
      - run: deno install
      - run: deno test packages/webhooks.js/test/** packages/webhooks-methods.js/test/deno/** --allow-env --allow-read --allow-net --allow-sys --no-check

  test-bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: cd packages/webhooks.js && bun test --filter webhooks.js

  validate-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          cache: npm
          node-version: lts/*
      - run: npm ci
      - run: npm run --workspaces --if-present validate:ts | true

  test:
    runs-on: ubuntu-latest
    needs:
      - test-bun
      - test_matrix
      - test-deno
      - validate-typescript
    steps:
      - run: exit 1
        if: ${{ needs.test_matrix.result != 'success' ||  needs.test-bun.result != 'success' || needs.test-deno.result != 'success' }}
    if: ${{ always() }}
